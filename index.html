<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusuf Umut - Retro 2009</title>
    <style>
        /* 2009 Tarzı Arkaplan ve Font */
        body {
            background-color: #e0e0e0;
            font-family: "Lucida Sans", "Lucida Sans Unicode", "Lucida Grande", Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* Ana Konteynır */
        .container {
            width: 800px;
            background-color: white;
            border-left: 2px solid #999;
            border-right: 2px solid #999;
            min-height: 100vh;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        /* Header / Logo Alanı (N Kısmı) */
        header {
            background: linear-gradient(to bottom, #4a4a4a 0%, #222 100%);
            color: white;
            padding: 30px;
            text-align: left;
            border-bottom: 4px solid #ff9900; /* Klasik vurgu rengi */
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            text-shadow: 2px 2px #000;
            letter-spacing: -1px;
        }

        /* Navigasyon (e, b, c kısımları) */
        nav {
            background: #333;
            display: flex;
            border-bottom: 1px solid #000;
        }

        nav a {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-right: 1px solid #444;
            /* Glossy Efekti */
            background: linear-gradient(to bottom, #555 0%, #333 50%, #111 50%, #222 100%);
        }

        nav a:hover {
            background: linear-gradient(to bottom, #777 0%, #555 50%, #222 50%, #444 100%);
            color: #ff9900;
        }

        /* İçerik Alanı */
        .main-content {
            padding: 20px;
            line-height: 1.6;
        }

        .post-title {
            border-bottom: 2px dotted #ccc;
            color: #222;
            margin-bottom: 15px;
        }

        /* Çizimindeki Orta Kutu (Görsel Alanı) */
        .image-placeholder {
            width: 300px;
            height: 180px;
            background: #eee;
            border: 5px solid #ddd;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.1);
        }

        /* Alt Kısımdaki Yuvarlak ve Dikdörtgen Alan */
        .footer-action {
            display: flex;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }

        .circle {
            width: 50px;
            height: 50px;
            background: #ff9900;
            border-radius: 50%;
            border: 3px solid #cc7a00;
            box-shadow: inset 0 0 10px white;
        }

        .bar {
            height: 25px;
            width: 300px;
            background: linear-gradient(to right, #ddd, #fff);
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 50px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Yusuf Umut</h1>
        </header>

        <nav>
            <a href="#">Home Page</a>
            <a href="#">Games</a>
            <a href="#">News</a>
        </nav>

        <div class="main-content">
            <h2 class="post-title">Welcome!</h2>
            <p>This website is for me and my games! You can find my games here!</p>

            <div class="image-placeholder">
                [Görsel Alanı]
            </div>

            <p>Alt tarafta yer alan kontrol paneli ve içerik akışı ile tam bir nostalji deneyimi sunuyoruz.</p>

            <div class="footer-action">
                <div class="circle"></div>
                <div class="bar"></div>
            </div>
        </div>

        <footer>
            &copy; 2026, Yusuf Umut Yılmaz
        </footer>
    </div>

</body>
</html>
